name: Publish sunbird-quml-player-web-component-react

# Manual trigger only: publishing to npm is a deliberate act, not a side effect
# of a tag push. This also avoids colliding with the Angular
# publish_web_component.yml workflow, which triggers on any tag ('*').
on:
  workflow_dispatch:

defaults:
  run:
    working-directory: projects/sunbird-quml-player-react

jobs:
  publish-npm:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.21.1'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Build web component
        # tsc -b && vite build && build:wc — emits web-component/ (assets + manifest)
        run: npm run build

      - name: Publish to NPM
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          echo "//registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}" > ~/.npmrc
          npm publish ./web-component --access public
